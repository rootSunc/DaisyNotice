name: DaisyNotice Poll

on:
  schedule:
    # Run daily at 12:00 UTC (modify as needed)
    - cron: '0 12 * * *'
  
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      send_test_notification:
        description: "Send a test notification instead of polling"
        required: false
        type: boolean
        default: false

jobs:
  poll:
    runs-on: ubuntu-latest
    
    # Configure Git commit permissions
    permissions:
      contents: write
    
    steps:
      # Check out code (keep history for subsequent git operations)
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      
      # Install dependencies
      - name: Install dependencies
        run: npm ci
      
      # Get Playwright version for caching
      - name: Get Playwright version
        id: playwright-version
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.send_test_notification != true }}
        run: |
          PLAYWRIGHT_VERSION=$(node -e "const pkg = JSON.parse(require('fs').readFileSync('package-lock.json')); console.log(pkg.packages['node_modules/playwright']?.version || pkg.dependencies['playwright']?.version || 'latest')")
          echo "version=$PLAYWRIGHT_VERSION" >> $GITHUB_OUTPUT
      
      # Cache Playwright browsers
      - name: Cache Playwright browsers
        id: playwright-cache
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.send_test_notification != true }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      
      # Install Playwright browsers (only if cache miss)
      - name: Install Playwright browsers
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.send_test_notification != true) && steps.playwright-cache.outputs.cache-hit != 'true' }}
        run: npx playwright install --with-deps chromium
      
      # Install Playwright dependencies (even if cache hit, some system deps might be needed)
      # Note: npx playwright install-deps chromium is fast if already installed
      - name: Install Playwright dependencies
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.send_test_notification != true }}
        run: npx playwright install-deps chromium
      
      # Configure Git (for automatic commits)
      - name: Configure git
        run: |
          git config --global user.name "daisy-notice-bot"
          git config --global user.email "daisy-notice-bot@github.com"
      
      # Run polling
      - name: Run poll
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.send_test_notification != true }}
        env:
          # Environment variables read from GitHub Secrets
          PILKE_BASE_URL: ${{ secrets.PILKE_BASE_URL }}
          PILKE_USERNAME: ${{ secrets.PILKE_USERNAME }}
          PILKE_PASSWORD: ${{ secrets.PILKE_PASSWORD }}
          MESSAGES_URL: ${{ secrets.MESSAGES_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
          EMAIL_WEBHOOK_URL: ${{ secrets.EMAIL_WEBHOOK_URL || secrets.MAIL_WEBHOOK_URL }}
          EMAIL_WEBHOOK_TOKEN: ${{ secrets.EMAIL_WEBHOOK_TOKEN || secrets.MAIL_WEBHOOK_TOKEN }}
          EMAIL_SMTP_HOST: ${{ secrets.EMAIL_SMTP_HOST || secrets.SMTP_HOST }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT || secrets.SMTP_PORT || '465' }}
          EMAIL_SMTP_SECURE: ${{ secrets.EMAIL_SMTP_SECURE || secrets.SMTP_SECURE }}
          EMAIL_SMTP_FALLBACK_PORT: ${{ secrets.EMAIL_SMTP_FALLBACK_PORT || secrets.SMTP_FALLBACK_PORT || '587' }}
          EMAIL_SMTP_FALLBACK_SECURE: ${{ secrets.EMAIL_SMTP_FALLBACK_SECURE || secrets.SMTP_FALLBACK_SECURE || 'false' }}
          EMAIL_SMTP_FAMILY: ${{ secrets.EMAIL_SMTP_FAMILY || secrets.SMTP_FAMILY || '4' }}
          EMAIL_SMTP_USER: ${{ secrets.EMAIL_SMTP_USER || secrets.SMTP_USER }}
          EMAIL_SMTP_PASS: ${{ secrets.EMAIL_SMTP_PASS || secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM || secrets.MAIL_FROM || secrets.EMAIL_SMTP_USER || secrets.SMTP_USER }}
          EMAIL_TO: ${{ secrets.EMAIL_TO || secrets.MAIL_TO }}
          POLL_INTERVAL_HOURS: ${{ secrets.POLL_INTERVAL_HOURS || '24' }}
          INITIAL_SYNC_MODE: ${{ secrets.INITIAL_SYNC_MODE || 'mark-seen' }}
          MESSAGE_ROW_SELECTOR: ${{ secrets.MESSAGE_ROW_SELECTOR }}
          MESSAGE_TITLE_SELECTOR: ${{ secrets.MESSAGE_TITLE_SELECTOR }}
          MESSAGE_BODY_SELECTOR: ${{ secrets.MESSAGE_BODY_SELECTOR }}
          MESSAGE_DATE_SELECTOR: ${{ secrets.MESSAGE_DATE_SELECTOR }}
          MESSAGES_NAV_LABELS: ${{ secrets.MESSAGES_NAV_LABELS || 'Viestit,Messages,Inbox' }}
          NOTIFICATION_CHANNELS: ${{ secrets.NOTIFICATION_CHANNELS || 'telegram' }}
          DEBUG_CAPTURE: ${{ secrets.DEBUG_CAPTURE || '0' }}
        run: npm run poll

      # Send a manual test notification without polling Daisy
      - name: Send test notification
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.send_test_notification == true }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
          EMAIL_WEBHOOK_URL: ${{ secrets.EMAIL_WEBHOOK_URL || secrets.MAIL_WEBHOOK_URL }}
          EMAIL_WEBHOOK_TOKEN: ${{ secrets.EMAIL_WEBHOOK_TOKEN || secrets.MAIL_WEBHOOK_TOKEN }}
          EMAIL_SMTP_HOST: ${{ secrets.EMAIL_SMTP_HOST || secrets.SMTP_HOST }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT || secrets.SMTP_PORT || '465' }}
          EMAIL_SMTP_SECURE: ${{ secrets.EMAIL_SMTP_SECURE || secrets.SMTP_SECURE }}
          EMAIL_SMTP_FALLBACK_PORT: ${{ secrets.EMAIL_SMTP_FALLBACK_PORT || secrets.SMTP_FALLBACK_PORT || '587' }}
          EMAIL_SMTP_FALLBACK_SECURE: ${{ secrets.EMAIL_SMTP_FALLBACK_SECURE || secrets.SMTP_FALLBACK_SECURE || 'false' }}
          EMAIL_SMTP_FAMILY: ${{ secrets.EMAIL_SMTP_FAMILY || secrets.SMTP_FAMILY || '4' }}
          EMAIL_SMTP_USER: ${{ secrets.EMAIL_SMTP_USER || secrets.SMTP_USER }}
          EMAIL_SMTP_PASS: ${{ secrets.EMAIL_SMTP_PASS || secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM || secrets.MAIL_FROM || secrets.EMAIL_SMTP_USER || secrets.SMTP_USER }}
          EMAIL_TO: ${{ secrets.EMAIL_TO || secrets.MAIL_TO }}
          NOTIFICATION_CHANNELS: ${{ secrets.NOTIFICATION_CHANNELS || 'telegram' }}
        run: npm run notify-test
      
      # Auto-commit polling data (only state.json, no login session required)
      - name: Auto-commit polling data
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.send_test_notification != true }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(data): update polling state [${{ github.run_number }}]"
          commit_options: '--no-verify'
          file_pattern: 'data/state.json'
          skip_dirty_check: true
          status_options: '--porcelain'
